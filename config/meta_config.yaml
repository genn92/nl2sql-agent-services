# 元数据仓库配置
tables:
  # 区域维度表
  - name: dim_region
    role: dim
    description: 存储订单区域维度信息
    columns:
      - name: region_id
        role: primary_key
        description: 区域维度的唯一标识
        alias: [ 地区ID, 区域ID ]
        sync: false

      - name: province
        role: dimension
        description: 区域所属省份
        alias: [ 省份, 省, 所在省份 ]
        sync: true

      - name: region_name
        role: dimension
        description: 区域名称
        alias: [ 地区, 区域, 大区 ]
        sync: true

      - name: country
        role: dimension
        description: 区域所属国家
        alias: [ 国家, 国家名称 ]
        sync: true

  # 客户维度表
  - name: dim_customer
    role: dim
    description: 存储订单客户维度信息
    columns:
      - name: customer_id
        role: primary_key
        description: 客户唯一标识
        alias: [ 客户ID, 用户ID ]
        sync: false

      - name: customer_name
        role: dimension
        description: 客户名称
        alias: [ 客户名称, 用户名称 ]
        sync: true

      - name: gender
        role: dimension
        description: 客户性别
        alias: [ 性别 ]
        sync: true

      - name: member_level
        role: dimension
        description: 客户会员等级
        alias: [ 会员等级, 用户等级 ]
        sync: true

  # 产品维度表
  - name: dim_product
    role: dim
    description: 存储订单产品维度信息
    columns:
      - name: product_id
        role: primary_key
        description: 产品唯一标识
        alias: [ 商品ID, 产品ID ]
        sync: false

      - name: product_name
        role: dimension
        description: 产品名称
        alias: [ 商品名称, 产品名称 ]
        sync: true

      - name: category
        role: dimension
        description: 产品分类
        alias: [ 商品类别, 品类, 分类 ]
        sync: true

      - name: brand
        role: dimension
        description: 产品品牌
        alias: [ 品牌, 品牌名称 ]
        sync: true

  # 日期维度表
  - name: dim_date
    role: dim
    description: 存储订单时间维度信息
    columns:
      - name: date_id
        role: primary_key
        description: 日期唯一标识，格式 yyyyMMdd
        alias: [ 日期ID, 日期 ]
        sync: false

      - name: year
        role: dimension
        description: 年份
        alias: [ 年, 年份 ]
        sync: false

      - name: quarter
        role: dimension
        description: 季度
        alias: [ 季度 ]
        sync: true

      - name: month
        role: dimension
        description: 月份
        alias: [ 月, 月份 ]
        sync: false

      - name: day
        role: dimension
        description: 日期
        alias: [ 日, 天 ]
        sync: false

  # 订单表
  - name: fact_order
    role: fact
    description: 存储订单关键信息
    columns:
      - name: order_id
        role: primary_key
        description: 订单唯一标识
        alias: [ 订单ID ]
        sync: false

      - name: customer_id
        role: foreign_key
        description: 关联客户ID
        alias: [ 客户ID, 用户ID ]
        sync: false

      - name: product_id
        role: foreign_key
        description: 关联产品ID
        alias: [ 商品ID, 产品ID ]
        sync: false

      - name: date_id
        role: foreign_key
        description: 关联日期ID
        alias: [ 日期, 下单日期 ]
        sync: false

      - name: region_id
        role: foreign_key
        description: 关联区域ID
        alias: [ 地区ID, 区域ID ]
        sync: false

      - name: order_quantity
        role: measure
        description: 订单数量
        alias: [ 销量, 购买数量, 件数 ]
        sync: false

      - name: order_amount
        role: measure
        description: 订单金额
        alias: [ 销售额, 订单金额, 收入 ]
        sync: false


# 指标
metrics:
  - name: GMV
    description: 所有订单成交金额总和
    relevant_columns:
      - fact_order.order_amount
    alias: [ 成交总额, 订单总额 ]

  - name: AOV
    description: 所有订单平均成交金额
    relevant_columns:
      - fact_order.order_quantity
    alias: [ 平均单价, 平均订单金额 ]
